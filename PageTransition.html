<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Website</title>

    <link rel="stylesheet" href="PageTransition.css">
</head>

<body>

    <!-- =========================
         PAGE TRANSITION / INTRO
    ========================== -->
    <div id="page-transition">

        <!-- Background glow -->
        <div class="glow glow-1"></div>
        <div class="glow glow-2"></div>

        <!-- Small stars -->
        <div class="stars"></div>

        <!-- Logo -->
        <div class="logo-container">
            <img src="assets/logo.png" alt="Website Logo" class="intro-logo">
        </div>

        <!-- Loading line -->
        <div class="loading-container">
            <div class="loading-bar"></div>
        </div>

    </div>


    <!-- =========================
         YOUR DASHBOARD
    ========================== -->
    <main id="dashboard">

        <nav class="navbar">
            <h2>My Dashboard</h2>

            <div class="nav-links">
                <a href="#">Home</a>
                <a href="#">About</a>
                <a href="#">Events</a>
                <a href="#">Profile</a>
            </div>
        </nav>

        <section class="hero">
            <div>
                <h1>Welcome to the Dashboard</h1>
                <p>
                    Your website content starts here.
                </p>

                <button>Get Started</button>
            </div>
        </section>

    </main>


    <script src="PageTransition.js"></script>

</body>
</html>
